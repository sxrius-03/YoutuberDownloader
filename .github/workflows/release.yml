name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Publish Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust toolchain
        run: |
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
        shell: pwsh

      - name: Install Node dependencies
        run: |
          npm install
          npm --prefix frontend install
        shell: pwsh

      - name: Ensure standalone binaries (yt-dlp, ffmpeg, ffprobe, qjs)
        run: |
          if (!(Test-Path "bin")) {
            New-Item -ItemType Directory -Path "bin" -Force
          }
          Write-Host "Fetching latest standalone yt-dlp.exe..."
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "bin/yt-dlp.exe"
          
          $required = @("bin/yt-dlp.exe", "bin/ffmpeg.exe", "bin/ffprobe.exe", "bin/qjs.exe")
          foreach ($b in $required) {
            if (!(Test-Path $b)) {
              throw "Required binary missing: $b"
            }
            $item = Get-Item $b
            Write-Host "Verified $b ($($item.Length) bytes)"
            if ($b -eq "bin/yt-dlp.exe" -and $item.Length -lt 5000000) {
              throw "yt-dlp.exe is too small ($($item.Length) bytes). Must be standalone PyInstaller binary."
            }
          }
          & "bin/yt-dlp.exe" --version
        shell: pwsh

      - name: Build Frontend & Compile Tauri Release
        run: npx tauri build
        shell: pwsh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe", "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          if (gh release view ${{ github.ref_name }} 2>$null) {
            gh release upload ${{ github.ref_name }} $files --clobber
          } else {
            gh release create ${{ github.ref_name }} $files --generate-notes
          }
        shell: pwsh
