name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Publish Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust toolchain
        run: |
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
        shell: pwsh

      - name: Install Node dependencies
        run: |
          npm install
          npm --prefix frontend install
        shell: pwsh

      - name: Build Frontend & Compile Tauri Release
        run: npx tauri build
        shell: pwsh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe", "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          if (gh release view ${{ github.ref_name }} 2>$null) {
            gh release upload ${{ github.ref_name }} $files --clobber
          } else {
            gh release create ${{ github.ref_name }} $files --generate-notes
          }
        shell: pwsh
